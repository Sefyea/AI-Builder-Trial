<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trial Challenge — ask the data</title>
<style>
:root{
  --bg:#faf9f7; --surface:#ffffff; --surface-2:#f4f2ee; --line:#e3e0d9; --line-2:#cec9be;
  --fg:#1f1e1c; --fg-2:#5f5c56; --fg-3:#8b877f;
  --ok:#0f6e56; --ok-bg:#e1f5ee; --warn:#854f0b; --warn-bg:#faeeda; --bad:#a32d2d; --bad-bg:#fcebeb;
  --accent:#185fa5; --accent-bg:#e6f1fb;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#16150f; --surface:#1e1d17; --surface-2:#26251d; --line:#33322a; --line-2:#4a4840;
  --fg:#f2f0ea; --fg-2:#b4b2a9; --fg-3:#888780;
  --ok:#5dcaa5; --ok-bg:#04342c; --warn:#efa027; --warn-bg:#412402; --bad:#f09595; --bad-bg:#501313;
  --accent:#85b7eb; --accent-bg:#042c53;
}}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1000px;margin:0 auto;padding:28px 20px 80px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;margin-bottom:6px}
h1{font-size:22px;font-weight:600;margin:0;letter-spacing:-.01em}
.pill{font-size:11px;padding:3px 9px;border-radius:20px;border:1px solid var(--line-2);color:var(--fg-2);
  background:var(--surface);white-space:nowrap}
.pill.live{color:var(--ok);border-color:var(--ok);background:var(--ok-bg)}
.pill.demo{color:var(--warn);border-color:var(--warn);background:var(--warn-bg)}
.sub{color:var(--fg-2);font-size:14px;margin:0 0 22px}
form{display:flex;gap:8px;margin-bottom:10px}
input[type=text]{flex:1;font:inherit;font-size:15px;padding:12px 14px;border:1px solid var(--line-2);
  border-radius:10px;background:var(--surface);color:var(--fg)}
input[type=text]:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
button{font:inherit;cursor:pointer}
.go{font-size:15px;padding:12px 20px;border:1px solid var(--fg);border-radius:10px;background:var(--fg);
  color:var(--bg);font-weight:500}
.go:disabled{opacity:.5;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}
.chip{font-size:12.5px;padding:5px 11px;border:1px solid var(--line);border-radius:20px;
  background:var(--surface);color:var(--fg-2)}
.chip:hover{border-color:var(--line-2);color:var(--fg)}
.cbar{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--fg-3);
  border-top:1px solid var(--line);padding-top:10px;margin-bottom:14px}
.cbar button{font-size:12.5px;padding:4px 10px;border:1px solid var(--line);border-radius:8px;
  background:var(--surface);color:var(--fg-2)}
.grp{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:18px;margin-bottom:14px}
.q{font-size:12.5px;color:var(--fg-3);margin-bottom:4px}
.q b{color:var(--fg-2);font-weight:500}
.nar{font-size:14px;color:var(--fg-2);margin:0 0 16px}
.conf{font-size:11px;color:var(--fg-3);font-family:var(--mono)}
.card+.card{margin-top:18px}
h2{font-size:15px;font-weight:600;margin:0 0 10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px}
.kpi{border:1px solid var(--line);border-left-width:3px;border-radius:0 9px 9px 0;padding:11px 12px;
  background:var(--surface-2)}
.kpi .v{font-size:19px;font-weight:600;line-height:1.25}
.kpi .l{font-size:12.5px;color:var(--fg-2);margin-top:3px;line-height:1.45}
.brow{display:flex;align-items:center;gap:10px;margin-bottom:5px;font-size:13px}
.brow .bn{width:180px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .bt{flex:1;height:16px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.brow .bf{display:block;height:100%;border-radius:4px}
.brow .bv{width:88px;flex:none;text-align:right;color:var(--fg-2);font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:500;color:var(--fg-2);padding:6px 8px;border-bottom:1px solid var(--line-2);
  white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--line)}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.ref{border-left:3px solid var(--bad);background:var(--bad-bg);padding:14px 16px;border-radius:0 9px 9px 0}
.ref h2{margin-bottom:6px}
.ref p{margin:0;font-size:14px}
.ev{margin-top:10px;font-size:12.5px;color:var(--fg-2);font-family:var(--mono);line-height:1.8}
.note p{margin:0;font-size:14px}
.strip{width:100%;height:auto;display:block}
.spec{margin-top:16px}
.spec button{font-size:11px;padding:3px 10px;border-radius:20px;border:1px solid var(--line);
  background:transparent;color:var(--fg-3)}
pre{font-family:var(--mono);font-size:11.5px;line-height:1.55;background:var(--surface-2);
  border:1px solid var(--line);border-radius:9px;padding:12px;overflow-x:auto;margin:10px 0 0;color:var(--fg-2)}
.think{border:1px dashed var(--line-2);border-radius:14px;padding:16px 18px;margin-bottom:14px;
  color:var(--fg-2);font-size:14px}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);
  margin-right:7px;animation:p 1.1s ease-in-out infinite}
@keyframes p{0%,100%{opacity:.25}50%{opacity:1}}
footer{margin-top:34px;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--fg-3)}
footer code{font-family:var(--mono);font-size:12px}
@media (max-width:620px){.brow .bn{width:110px}.brow .bv{width:76px}}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>Trial Challenge</h1>
  <span class="pill" id="mode">checking…</span>
</header>
<p class="sub">Ask a question. An AI agent decides what to query and which cards to draw. The page renders whatever comes back.</p>

<form id="f" autocomplete="off">
  <input type="text" id="q" placeholder="e.g. how much money is stuck?" aria-label="Ask the data a question">
  <button class="go" type="submit" id="go">Ask</button>
</form>
<div class="chips" id="chips"></div>

<div class="cbar"><span id="cnt">canvas empty</span><button type="button" id="clr">clear canvas</button></div>
<div id="cv"></div>

<footer>
  If n8n is not live the page answers from a built-in demo responder so it still works on GitHub Pages.
</footer>

</div>

<script>
/* ============================================================
   CONFIG — the only two lines you need to edit
   ============================================================ */
const WEBHOOK_URL = "https://sinigang.app.n8n.cloud/webhook/ask";                 // e.g. "https://you.app.n8n.cloud/webhook/ask"
const DATA_URL    = "./data.json";      // published next to this file, fetched by n8n
const CONTRACT_V  = 1;                  // reject specs the page doesn't understand

/* ============================================================
   Layer 4 of the safety net: the allowed card vocabulary.
   Anything not in here is downgraded to a note, never thrown away.
   ============================================================ */
const ALLOWED = ["kpi", "bar", "table", "strip", "refusal", "note"];

const EXAMPLES = [
  "How much money is stuck?",
  "Who owes us the most?",
  "Show revenue by industry",
  "Which drafts were never sent?",
  "Who's our oldest client?",
  "What do we charge for server maintenance?",
  "Which account managers have a collections problem?"
];

const SESSION = "s-" + Math.random().toString(36).slice(2, 10);
const cv = document.getElementById("cv");
const cnt = document.getElementById("cnt");
const qEl = document.getElementById("q");
const goEl = document.getElementById("go");
let lastSpec = null, n = 0, busy = false;

/* ---------- helpers ---------- */
const esc = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const money = v => "$" + Math.round(Number(v) || 0).toLocaleString("en-US");
const toneVar = t => t === "bad" ? "var(--bad)" : t === "warn" ? "var(--warn)" : t === "ok" ? "var(--ok)" : "var(--accent)";

/* ============================================================
   Layer 3: normalise anything the server sends into a shape
   the renderer can survive. Never throws.
   ============================================================ */
function normalise(raw) {
  const s = (raw && typeof raw === "object") ? raw : {};
  if (s.v && Number(s.v) > CONTRACT_V) {
    return { v: CONTRACT_V, intent: "unsupported_contract", narration: "",
      cards: [{ type: "note", title: "This response uses a newer contract",
        body: "The agent returned spec version " + s.v + " but this page understands version " + CONTRACT_V + ". Update the page." }] };
  }
  let cards = Array.isArray(s.cards) ? s.cards : [];
  cards = cards.slice(0, 8).map(c => {
    if (!c || typeof c !== "object") return { type: "note", title: "Empty card", body: "The agent returned a blank card." };
    if (!ALLOWED.includes(c.type)) {
      return { type: "note", title: "Unsupported card type: " + esc(c.type),
        body: c.title ? String(c.title) : "The agent asked for a card this page cannot draw, so here it is as text." };
    }
    return c;
  });
  if (!cards.length) {
    cards = [{ type: "note", title: "Nothing to draw",
      body: String(s.narration || "The agent returned no renderable cards.").slice(0, 400) }];
  }
  return { v: CONTRACT_V, intent: String(s.intent || "unknown"),
    confidence: (typeof s.confidence === "number" ? s.confidence : null),
    narration: String(s.narration || "").slice(0, 400), cards };
}

/* ---------- card renderers ---------- */
function rKpi(c) {
  const items = Array.isArray(c.items) ? c.items.slice(0, 8) : [];
  return `<h2>${esc(c.title)}</h2><div class="kpis">` + items.map(k =>
    `<div class="kpi" style="border-left-color:${toneVar(k.tone)}">
       <div class="v" style="color:${toneVar(k.tone)}">${esc(k.v)}</div>
       <div class="l">${esc(k.l)}</div></div>`).join("") + `</div>`;
}
function rBar(c) {
  const rows = (Array.isArray(c.rows) ? c.rows : []).slice(0, 20)
    .map(r => Array.isArray(r) ? { label: r[0], value: Number(r[1]) } : { label: r.label, value: Number(r.value) })
    .filter(r => isFinite(r.value));
  if (!rows.length) return rNote({ title: c.title, body: "No rows to plot." });
  const mx = Math.max(...rows.map(r => Math.abs(r.value))) || 1;
  const unit = c.unit === "%" ? v => v + "%" : money;
  return `<h2>${esc(c.title)}</h2>` + rows.map(r =>
    `<div class="brow"><span class="bn" title="${esc(r.label)}">${esc(r.label)}</span>
      <span class="bt"><span class="bf" style="width:${(Math.abs(r.value) / mx * 100).toFixed(1)}%;background:${toneVar(c.tone)}"></span></span>
      <span class="bv">${esc(unit(r.value))}</span></div>`).join("");
}
function rTable(c) {
  const cols = Array.isArray(c.columns) ? c.columns : [];
  const rows = (Array.isArray(c.rows) ? c.rows : []).slice(0, 60);
  const mcols = Array.isArray(c.money_columns) ? c.money_columns : [];
  return `<h2>${esc(c.title)}</h2><div class="tw"><table><thead><tr>` +
    cols.map(h => `<th>${esc(h)}</th>`).join("") + `</tr></thead><tbody>` +
    rows.map(r => `<tr>` + (Array.isArray(r) ? r : []).map((v, i) =>
      typeof v === "number"
        ? `<td class="n">${esc(mcols.includes(i) || mcols.includes(cols[i]) ? money(v) : v.toLocaleString("en-US"))}</td>`
        : `<td>${esc(v)}</td>`).join("") + `</tr>`).join("") +
    `</tbody></table></div>`;
}
function rRef(c) {
  const ev = Array.isArray(c.evidence) ? c.evidence.slice(0, 12) : [];
  return `<div class="ref"><h2>${esc(c.title)}</h2><p>${esc(c.body)}</p>` +
    (ev.length ? `<div class="ev">` + ev.map(e =>
      Array.isArray(e) ? esc(e[0]) + " &middot; " + esc(e[1]) : esc(e)).join("<br>") + `</div>` : "") + `</div>`;
}
function rNote(c) { return `<div class="note"><h2>${esc(c.title)}</h2><p>${esc(c.body)}</p></div>`; }
function rStrip(c) {
  const vals = (Array.isArray(c.values) ? c.values : []).map(Number).filter(isFinite);
  if (!vals.length) return rNote({ title: c.title, body: "No values to plot." });
  const W = 620, H = 72, mx = Math.max(...vals) * 1.05, x = v => 36 + (v / mx) * (W - 72);
  const mk = [["p25", c.p25], ["median", c.med], ["p75", c.p75]].filter(m => isFinite(Number(m[1])));
  return `<h2>${esc(c.title)}</h2><svg class="strip" viewBox="0 0 ${W} ${H}" role="img">
    <title>${esc(c.title)}</title>
    ${mk.map(m => `<line x1="${x(m[1]).toFixed(1)}" y1="16" x2="${x(m[1]).toFixed(1)}" y2="40" stroke="var(--line-2)" stroke-width="1"/>
      <text x="${x(m[1]).toFixed(1)}" y="12" text-anchor="middle" font-size="10.5" fill="var(--fg-3)" font-family="var(--sans)">${esc(m[0])}</text>`).join("")}
    <line x1="36" y1="28" x2="${W - 36}" y2="28" stroke="var(--line)" stroke-width="1"/>
    ${vals.map(v => `<circle cx="${x(v).toFixed(1)}" cy="28" r="5" fill="${toneVar(c.tone || "bad")}" fill-opacity="0.45" stroke="${toneVar(c.tone || "bad")}" stroke-width="1"/>`).join("")}
    <text x="36" y="58" font-size="10.5" fill="var(--fg-2)" font-family="var(--sans)">${esc(money(Math.min(...vals)))}</text>
    <text x="${W - 36}" y="58" text-anchor="end" font-size="10.5" fill="var(--fg-2)" font-family="var(--sans)">${esc(money(Math.max(...vals)))}</text>
  </svg>`;
}
const RENDER = { kpi: rKpi, bar: rBar, table: rTable, refusal: rRef, note: rNote, strip: rStrip };

/* ============================================================
   Render a group. Each card is individually try/caught so one
   bad card cannot take the canvas down.
   ============================================================ */
function render(question, raw, src) {
  const s = normalise(raw);
  lastSpec = s;
  const id = "spec" + (++n);
  const SRC = { cache: "from cache &middot; no agent call",
                static: "precomputed &middot; no agent call",
                live: "live agent call" };
  let body = "";
  s.cards.forEach(c => {
    try { body += `<div class="card">` + RENDER[c.type](c) + `</div>`; }
    catch (err) {
      body += `<div class="card">` + rNote({ title: "This card failed to render",
        body: "type: " + (c && c.type) + " — " + (err && err.message) }) + `</div>`;
    }
  });
  const conf = s.confidence === null ? "" : ` <span class="conf">confidence ${s.confidence}</span>`;
  const badge = SRC[src] ? ` <span class="conf">&middot; ${SRC[src]}</span>` : "";
  const el = document.createElement("div");
  el.className = "grp";
  el.innerHTML =
    `<div class="q">you asked &middot; <b>${esc(question)}</b>${conf}${badge}</div>` +
    (s.narration ? `<p class="nar">${esc(s.narration)}</p>` : "") + body +
    `<div class="spec"><button type="button" data-spec="${id}">show the spec the agent returned</button>
      <pre id="${id}" hidden>${esc(JSON.stringify(s, null, 1))}</pre></div>`;
  cv.insertBefore(el, cv.firstChild);
  const k = cv.children.length;
  cnt.textContent = k + " answer" + (k > 1 ? "s" : "") + " on canvas";
}

/* ============================================================
   Spend guards. A public page must never bill you for a page view.

   1. Nothing fires on load — the opening view is precomputed.
   2. Identical questions come from cache, forever.
   3. A per-browser daily cap and a cooldown between calls.

   These are client-side, so they stop accidents and casual F5
   spam, not a determined actor. The real backstop is the weekly
   limit on the OpenRouter key — set that deliberately.
   ============================================================ */
const MAX_CALLS_PER_DAY = 25;
const COOLDOWN_MS = 4000;
const CACHE_KEY = "gr.cache.v1";
const QUOTA_KEY = "gr.quota.v1";
let lastCallAt = 0;

const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const keyOf = q => q.trim().toLowerCase().replace(/[^a-z0-9 ]/g, "").replace(/\s+/g, " ");

function cacheGet(q) { return store.get(CACHE_KEY, {})[keyOf(q)] || null; }
function cachePut(q, spec) {
  const c = store.get(CACHE_KEY, {});
  c[keyOf(q)] = spec;
  const ks = Object.keys(c);
  if (ks.length > 40) delete c[ks[0]];
  store.set(CACHE_KEY, c);
}
function quota() {
  const today = new Date().toISOString().slice(0, 10);
  const q = store.get(QUOTA_KEY, {});
  if (q.day !== today) return { day: today, used: 0 };
  return q;
}
function quotaBump() {
  const q = quota();
  q.used += 1;
  store.set(QUOTA_KEY, q);
  return q;
}
function guardCheck() {
  const q = quota();
  if (q.used >= MAX_CALLS_PER_DAY) {
    return "This browser has used its " + MAX_CALLS_PER_DAY +
      " agent calls for today. Previously asked questions still answer instantly from cache. The cap resets at midnight.";
  }
  const wait = COOLDOWN_MS - (Date.now() - lastCallAt);
  if (wait > 0) {
    return "One question every " + (COOLDOWN_MS / 1000) + " seconds. Try again in " +
      Math.ceil(wait / 1000) + "s.";
  }
  return null;
}
function guardNote(msg) {
  return { v: 1, intent: "rate_limited", confidence: null, narration: "",
    cards: [{ type: "note", title: "Held back to protect the token budget", body: msg }] };
}

/* ============================================================
   Transport
   ============================================================ */
async function callAgent(question) {
  if (!WEBHOOK_URL) return DEMO(question);
  const res = await fetch(WEBHOOK_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ question, session_id: SESSION, data_url: DATA_URL,
      // Slim breadcrumb, not the whole spec — this text is re-sent on every model
      // call inside the agent loop, so a full spec here costs ~250 tokens x N calls.
      previous: lastSpec ? {
        intent: lastSpec.intent,
        cards: lastSpec.cards.map(c => c.type + ":" + String(c.title).slice(0, 40))
      } : null })
  });
  if (!res.ok) throw new Error("webhook returned HTTP " + res.status);
  return await res.json();
}

async function ask(question) {
  if (busy || !question.trim()) return;

  // Free paths first — neither costs a token.
  const hit = cacheGet(question);
  if (hit) { qEl.value = ""; render(question, hit, "cache"); return; }
  const blocked = guardCheck();
  if (blocked) { qEl.value = ""; render(question, guardNote(blocked), "static"); return; }

  busy = true; goEl.disabled = true;
  const t = document.createElement("div");
  t.className = "think";
  t.innerHTML = `<span class="dot"></span>agent working — classifying intent, calling run_query, choosing cards…`;
  cv.insertBefore(t, cv.firstChild);
  qEl.value = "";
  try {
    if (WEBHOOK_URL) { lastCallAt = Date.now(); quotaBump(); }
    const spec = await callAgent(question);
    t.remove();
    render(question, spec, WEBHOOK_URL ? "live" : "static");
    if (spec && Array.isArray(spec.cards) && spec.intent !== "transport_error") cachePut(question, spec);
  } catch (err) {
    t.remove();
    render(question, { v: 1, intent: "transport_error", narration: "", cards: [{
      type: "refusal", title: "Could not reach the agent",
      body: (err && err.message) + ". Nine times out of ten this is CORS: the n8n webhook must return an Access-Control-Allow-Origin header matching this page's origin, and must answer the OPTIONS preflight. Check the browser console for the exact block.",
      evidence: [["origin", location.origin], ["webhook", WEBHOOK_URL || "(not set)"]]
    }] });
  } finally { busy = false; goEl.disabled = false; qEl.focus(); }
}

/* ============================================================
   DEMO responder — stands in for n8n so the page is alive
   the moment you publish it. Delete once WEBHOOK_URL is set.
   ============================================================ */
function DEMO(q) {
  const R = [
    [/stuck|trapped|invisible|leak|hidden|how much money/i, {
      v: 1, intent: "quantify_invisible_money", confidence: 0.95,
      narration: "Four states that no status field, aging report or pipeline view currently surfaces. Every figure is computed in code, not by me.",
      cards: [
        { type: "kpi", title: "Money the reports cannot see", items: [
          { v: "$654,422", l: "total invisible", tone: "bad" },
          { v: "$138,142", l: "14 invoices still in Draft, median 262 days old", tone: "bad" },
          { v: "$172,042", l: "23 invoices labelled Sent, all already past due", tone: "bad" },
          { v: "$84,253", l: "2 estimates won, never invoiced", tone: "bad" },
          { v: "$259,985", l: "16 quotes Pending beyond 180 days", tone: "warn" }] },
        { type: "note", title: "For comparison", body: "The overdue balance they already track is $518,938, so the invisible pile is 26% larger. Only $394,437 of it is invoiceable today; the stale quotes are pipeline hygiene, not billable work." }] }],
    [/owes|worst|past due|debtor|who.*overdue/i, {
      v: 1, intent: "rank_past_due_by_client", confidence: 0.9,
      narration: "Past due includes the 23 invoices mislabelled as Sent, which is why these totals exceed what their AR report shows.",
      cards: [{ type: "bar", title: "Past due by client, top 8", unit: "$", tone: "bad", rows: [
        ["Bedrock Construction", 101000], ["Mason & Associates", 46652], ["Greenfield Medical", 45021],
        ["Coral Retail Co", 35950], ["Summit Realty", 35458], ["Westlake Schools", 35340],
        ["Ironclad Construction", 30871], ["Bayside Resort", 30093]] }] }],
    [/industry|sector|vertical|segment/i, {
      v: 1, intent: "refuse_unsupported_query", confidence: 0.99,
      narration: "I will not answer this one.",
      cards: [
        { type: "refusal", title: "The industry column is wrong on 26 of 30 clients",

    [/oldest|longest|tenure|account age|newest client/i, {
      v: 1, intent: "rank_clients_by_claimed_tenure", confidence: 0.4,

    [/account manager|primary contact|collector|rep\b/i, {

    [/health|at risk|churn/i, {
      v: 1, intent: "challenge_premise", confidence: 0.9,

  ];
  const hit = R.find(r => r[0].test(q));
  const spec = hit ? hit[1] : {
    v: 1, intent: "unrecognised", confidence: 0.2, narration: "I could not map that to a query I trust.",
    cards: [{ type: "note", title: "Try one of these",
      body: "I can quantify the invisible money, rank past-due clients, list the unsent drafts, show pricing spread for any bundle, or break collections down by account manager. Ask about industry or client health and I will tell you why I refuse." }] };
  return new Promise(r => setTimeout(() => r(spec), 650));
}

/* ---------- wiring ---------- */
document.getElementById("chips").innerHTML =
  EXAMPLES.map((e, i) => `<button type="button" class="chip" data-i="${i}">${esc(e)}</button>`).join("");
document.getElementById("chips").addEventListener("click", e => {
  const c = e.target.closest(".chip"); if (c) ask(EXAMPLES[+c.dataset.i]);
});
document.getElementById("f").addEventListener("submit", e => { e.preventDefault(); ask(qEl.value); });
document.getElementById("clr").addEventListener("click", () => {
  cv.innerHTML = ""; cnt.textContent = "canvas empty"; lastSpec = null;
});
cv.addEventListener("click", e => {
  const b = e.target.closest("button[data-spec]"); if (!b) return;
  const p = document.getElementById(b.dataset.spec);
  p.hidden = !p.hidden;
  b.textContent = p.hidden ? "show the spec the agent returned" : "hide the spec";
});
const modeEl = document.getElementById("mode");
function refreshMode() {
  const q = quota();
  if (WEBHOOK_URL) {
    modeEl.textContent = "live · n8n · " + Math.max(0, MAX_CALLS_PER_DAY - q.used) + " calls left today";
    modeEl.className = "pill live";
  } else {
    modeEl.textContent = "demo mode · webhook not set";
    modeEl.className = "pill demo";
  }
}
refreshMode();
setInterval(refreshMode, 5000);
